version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prani_postgres
    environment:
      POSTGRES_USER: prani_user
      POSTGRES_PASSWORD: prani_password
      POSTGRES_DB: prani_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prani_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prani_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: prani_chroma
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - prani_network

volumes:
  postgres_data:
  chroma_data:

networks:
  prani_network:
    driver: bridge
